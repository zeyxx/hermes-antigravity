name: antigravity
kind: model-provider
version: 1.2.0
description: Google Antigravity / Cloud Code Assist inference provider for Hermes Agent
author: Sovereign Operator
# Hermes core must provide ProviderProfile.create_client(). Older cores ignore the
# hook and POST an OpenAI-shaped request that the Antigravity API answers with a
# silent 404 on every turn. __init__.py also gates this at load time; this field
# is the declarative copy the loader and the catalog actually enforce
# (requires_hermes, SemVer floor). See https://github.com/zeyxx/hermes-antigravity/issues/4
requires_hermes: ">=0.20.0"
