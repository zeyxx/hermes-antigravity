name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly clean-room run: catches rot that no PR exposes (upstream Hermes
  # moves, a dependency breaks, the relay changes shape). Runners are virgin
  # every time, so each scheduled run is a reproducibility measurement.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # fail-fast: false so a Windows/macOS failure does not cancel the other
      # OSes — cross-platform validation wants all three results, not the first.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # bash on every OS: the run steps use POSIX syntax ($(...),
        # >> "$GITHUB_ENV"). Windows' default pwsh would break them; git bash
        # ships on the windows runner.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # This plugin is a Hermes model-provider module: its modules import
      # `providers`, which only exists inside a Hermes install. The runner has
      # none, so the suite cannot run without one. Cloning the core gives the
      # tests the real registry to register against.
      #
      # PyPI's `hermes-agent` is not used: it is versioned 0.19.0 while the plugin
      # requires >= 0.20.0 (ProviderProfile.create_client), and catalog rule 14
      # wants a truthful SemVer floor rather than a CalVer date.
      - name: Fetch the Hermes core
        run: |
          git clone --depth 1 https://github.com/NousResearch/hermes-agent.git \
            "$RUNNER_TEMP/hermes-agent"
          echo "HERMES_CORE=$RUNNER_TEMP/hermes-agent" >> "$GITHUB_ENV"

      - name: Collect test count
        # Recorded before the run: a module that fails to import silently drops its
        # tests, and a suite that only runs a subset still reports green.
        # Single source of truth: tools/run_tests.py --collect-only counts with
        # the same MODULES list and the same collector the run uses, so the two
        # cannot drift apart (a hand-maintained copy once missed a whole module
        # and every Test* class).
        #
        # No PYTHONPATH here: run_tests.py::_ensure_paths() inserts HERMES_CORE
        # and the repo root into sys.path itself. That is also what keeps this
        # cross-platform — a POSIX ":" PYTHONPATH separator breaks on Windows
        # (it needs ";"). `python` (not `python3`) is used for the same reason.
        id: collect
        run: |
          count=$(python tools/run_tests.py --collect-only)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "collected $count tests"

      - name: Run test suite
        run: python tools/run_tests.py --min-tests "${{ steps.collect.outputs.count }}"

      - name: Lint
        run: |
          python -m pip install --quiet ruff
          ruff check .

  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare wire constants against pi-antigravity
        run: python3 tools/check_upstream_drift.py

      - name: Drift report (machine-readable)
        if: always()
        run: python3 tools/check_upstream_drift.py --json > drift-report.json || true

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-drift-report
          path: drift-report.json

  repro:
    # Full clean-room reproducibility: run the real Hermes CLI from a fresh
    # upstream git clone — no install, no host state. Upstream deliberately
    # refuses wheel builds ("Building wheels or sdists for hermes-agent is
    # not supported"), so pip-installing the CLI is not an option; running
    # it in place from the clone is the supported shape (the CLI
    # self-provisions its runtime under a fresh HERMES_HOME).
    # The tests job proves the code; this job proves a stranger can load it
    # through the loader's own admission probe. Deliberately NOT in the
    # branch-protection required set: it tracks upstream main, which this
    # repo does not control.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the Hermes core
        run: |
          git clone --depth 1 https://github.com/NousResearch/hermes-agent.git \
            "$RUNNER_TEMP/hermes-agent"

      - name: Install probe-only dependencies
        # The CLI runs in place from the clone (upstream refuses wheel
        # builds), so its third-party imports must come from the runner env.
        # Only what the `plugins validate` probe path imports — not the full
        # upstream dev environment (pm/uv-managed, out of scope here).
        run: python -m pip install --quiet ruamel.yaml python-dotenv rich packaging

      - name: Loader admission probe
        run: |
          cat > "$RUNNER_TEMP/run_validate.py" <<'EOF'
          import sys
          sys.argv = ["hermes", "plugins", "validate", ".", "--json"]
          from hermes_cli.main import main
          raise SystemExit(main())
          EOF
          PYTHONPATH="$RUNNER_TEMP/hermes-agent" \
          HERMES_HOME="$RUNNER_TEMP/hermes-home" \
          python "$RUNNER_TEMP/run_validate.py" > validate.json
          python -c "import json,sys; d=json.load(open('validate.json')); print('validate ok:', d['ok']); sys.exit(0 if d['ok'] else 1)"

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-validate-report
          path: validate.json
