name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # This plugin is a Hermes model-provider module: its modules import
      # `providers`, which only exists inside a Hermes install. The runner has
      # none, so the suite cannot run without one. Cloning the core gives the
      # tests the real registry to register against.
      #
      # PyPI's `hermes-agent` is not used: it is versioned 0.19.0 while the plugin
      # requires >= 0.20.0 (ProviderProfile.create_client), and catalog rule 14
      # wants a truthful SemVer floor rather than a CalVer date.
      - name: Fetch the Hermes core
        run: |
          git clone --depth 1 https://github.com/NousResearch/hermes-agent.git \
            "$RUNNER_TEMP/hermes-agent"
          echo "HERMES_CORE=$RUNNER_TEMP/hermes-agent" >> "$GITHUB_ENV"

      - name: Collect test count
        # Recorded before the run: a module that fails to import silently drops its
        # tests, and a suite that only runs a subset still reports green.
        id: collect
        env:
          PYTHONPATH: ".:${{ env.HERMES_CORE }}"
        run: |
          count=$(python3 - <<'PY'
          import importlib, sys, os
          sys.path.insert(0, ".")
          sys.path.insert(0, os.environ["HERMES_CORE"])
          try:
              import providers  # noqa: F401
          except Exception as exc:
              print(f"providers unavailable: {exc}", file=sys.stderr)
              print(0)
              raise SystemExit(0)
          total = 0
          for m in ("tests.test_translator", "tests.test_models", "tests.test_auth",
                    "tests.test_client", "tests.test_accounts"):
              try:
                  mod = importlib.import_module(m)
              except Exception as exc:
                  print(f"module import failure {m}: {exc}", file=sys.stderr)
                  continue
              total += sum(1 for n in dir(mod)
                           if n.startswith("test_") and callable(getattr(mod, n)))
          print(total)
          PY
          )
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "collected $count tests"

      - name: Run test suite
        env:
          PYTHONPATH: ".:${{ env.HERMES_CORE }}"
        run: python3 tools/run_tests.py --min-tests "${{ steps.collect.outputs.count }}"

      - name: Lint
        continue-on-error: true
        run: |
          python3 -m pip install --quiet ruff
          ruff check .

  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare wire constants against pi-antigravity
        run: python3 tools/check_upstream_drift.py --refresh

      - name: Drift report (machine-readable)
        if: always()
        run: python3 tools/check_upstream_drift.py --json > drift-report.json || true

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-drift-report
          path: drift-report.json
